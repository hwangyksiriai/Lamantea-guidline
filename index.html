<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lamantea Hub</title>
  <meta name="theme-color" content="#363D21">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #4B5530;
      --brand-deep: #363D21;
      --brand-line: #6E7A45;
      --brand-pale: #EEF0E2;
      --brand-text: #5A6634;
      --gold: #B08D4C;
      --cream: #FAF8F3;
      --warm-white: #F3F0E6;
      --text-dark: #26261E;
      --text-mid: #57533F;
      --text-light: #827C64;
      --border: #E3DDCC;
      --serif: 'Cormorant Garamond', 'Noto Sans KR', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--cream);
      color: var(--text-dark);
      font-size: 15px;
      line-height: 1.7;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .ic { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* LOCK */
    .lock {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--brand-deep);
      background-image: radial-gradient(ellipse at 50% 0%, rgba(176,141,76,0.25) 0%, rgba(54,61,33,0) 60%);
    }
    .lock-card {
      width: 100%;
      max-width: 360px;
      background: var(--cream);
      border-radius: 18px;
      padding: 36px 28px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .lock-mark { font-family: var(--serif); font-size: 34px; font-weight: 600; color: var(--brand-deep); line-height: 1; }
    .lock-sub { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-light); margin: 10px 0 26px; }
    .lock-input {
      width: 100%;
      font-family: inherit;
      font-size: 22px;
      letter-spacing: 0.5em;
      text-align: center;
      padding: 14px 12px 14px calc(12px + 0.5em);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #FFFFFF;
      color: var(--text-dark);
    }
    .lock-input:focus { outline: none; border-color: var(--brand-line); }
    .lock-btn {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: var(--brand-deep);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .lock-err { min-height: 22px; margin-top: 10px; font-size: 13px; color: #A34A3C; }
    .shake { animation: shake 0.35s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    /* HUB */
    .hub { display: none; }
    .hub.open { display: block; }
    .hub-head {
      background: var(--brand-deep);
      color: #FFFFFF;
      text-align: center;
      padding: 44px 20px 36px;
    }
    .hub-eyebrow { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 12px; }
    .hub-title { font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1; }
    .hub-tag { font-family: var(--serif); font-style: italic; font-size: 16px; color: #E6D7A8; margin-top: 8px; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }

    .folder {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .folder-sum {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .folder-sum::-webkit-details-marker { display: none; }
    .folder-ico {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--brand);
      color: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
    }
    .folder-name { flex: 1; font-size: 17px; font-weight: 700; }
    .folder-count { font-size: 13px; color: var(--text-light); }
    .folder-chev { color: var(--text-light); transition: transform 0.2s; }
    .folder[open] .folder-chev { transform: rotate(180deg); }
    .folder-body { border-top: 1px solid var(--border); background: var(--cream); padding: 14px; display: grid; gap: 10px; }

    .asset {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .asset-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .asset-chip {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--brand-pale);
      color: var(--brand-text);
      border: 1px solid var(--brand-line);
    }
    .asset-chip.all { background: var(--brand-deep); color: #FFFFFF; border-color: var(--brand-deep); }
    .asset-note { font-size: 12.5px; color: var(--text-light); }
    .asset-name { font-size: 15.5px; font-weight: 700; margin-bottom: 2px; }
    .asset-url { font-size: 12.5px; color: var(--text-mid); word-break: break-all; margin-bottom: 12px; }
    .asset-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-open { background: var(--brand-deep); color: #FFFFFF; border: 1px solid var(--brand-deep); }
    .btn-copy { background: #FFFFFF; color: var(--brand-text); border: 1px solid var(--brand-line); }
    .btn .ic { width: 16px; height: 16px; }

    .hub-foot { text-align: center; font-size: 12.5px; color: var(--text-light); margin-top: 24px; }
    .logout { background: none; border: none; font-family: inherit; font-size: 12.5px; color: var(--text-mid); text-decoration: underline; cursor: pointer; margin-top: 6px; }

    .toast {
      position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom, 28px));
      transform: translateX(-50%) translateY(10px);
      background: rgba(38,38,30,0.94); color: #FFFFFF;
      font-size: 13.5px; padding: 10px 18px; border-radius: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
      max-width: calc(100% - 32px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  </defs>
</svg>

<!-- 잠금 화면 -->
<div class="lock" id="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <div class="lock-mark">Lamantea</div>
    <div class="lock-sub">Campaign Hub</div>
    <input class="lock-input" id="pw" type="password" inputmode="numeric" maxlength="8" placeholder="····" aria-label="비밀번호" autofocus>
    <button class="lock-btn" type="submit">입장하기</button>
    <div class="lock-err" id="err" role="alert"></div>
  </form>
</div>

<!-- 허브 -->
<div class="hub" id="hub">
  <header class="hub-head">
    <div class="hub-eyebrow">Campaign Hub</div>
    <div class="hub-title">Lamantea</div>
    <div class="hub-tag">L'olio che natura crea</div>
  </header>
  <main class="wrap" id="folders"></main>
  <div class="hub-foot">
    이 페이지는 내부용입니다. 아래 소제목은 허브에서만 보입니다.<br>
    <button class="logout" type="button" onclick="lockHub()">잠그기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // 비밀번호 SHA-256 해시 (평문은 소스에 두지 않음)
  const PW_HASH = '1b879216dc17755c07c11fd2b7e15dd8df5ef7f8c0a3f27e1c6f0ddb4d2c03b6';
  const KEY = 'lamantea-hub-ok';

  // 폴더 · 에셋 목록 — 새 캠페인은 여기에 추가
  const FOLDERS = [
    {
      name: '12월 진행',
      open: true,
      assets: [
        { chip: '통합 전달용', all: true, note: '신청 폼 없음', name: '라만테아 인플루언서 가이드라인', path: 'dec/guide.html' },
        { chip: '5만원', name: '라만테아 인플루언서 가이드라인', path: 'dec/a.html' },
        { chip: '10만원', name: '라만테아 인플루언서 가이드라인', path: 'dec/b.html' },
        { chip: '20만원', name: '라만테아 인플루언서 가이드라인', path: 'dec/c.html' }
      ]
    }
  ];

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
  function absUrl(p) { return new URL(p, location.href).href; }

  function render() {
    document.getElementById('folders').innerHTML = FOLDERS.map(f => `
      <details class="folder"${f.open ? ' open' : ''}>
        <summary class="folder-sum">
          <span class="folder-ico"><svg class="ic"><use href="#i-folder"/></svg></span>
          <span class="folder-name">${esc(f.name)}</span>
          <span class="folder-count">${f.assets.length}개</span>
          <svg class="ic folder-chev"><use href="#i-chev"/></svg>
        </summary>
        <div class="folder-body">
          ${f.assets.map(a => `
            <div class="asset">
              <div class="asset-top">
                <span class="asset-chip${a.all ? ' all' : ''}">${esc(a.chip)}</span>
                ${a.note ? `<span class="asset-note">${esc(a.note)}</span>` : ''}
              </div>
              <div class="asset-name">${esc(a.name)}</div>
              <div class="asset-url">${esc(absUrl(a.path))}</div>
              <div class="asset-actions">
                <a class="btn btn-open" href="${esc(a.path)}" target="_blank" rel="noopener"><svg class="ic"><use href="#i-open"/></svg>열기</a>
                <button class="btn btn-copy" type="button" data-url="${esc(absUrl(a.path))}"><svg class="ic"><use href="#i-copy"/></svg>링크 복사</button>
              </div>
            </div>`).join('')}
        </div>
      </details>`).join('');

    document.querySelectorAll('.btn-copy').forEach(b => b.addEventListener('click', () => copy(b.dataset.url)));
  }

  function toast(t) {
    const el = document.getElementById('toast');
    el.textContent = t;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1600);
  }
  function copy(text) {
    const done = () => toast('링크가 복사되었습니다');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
    } else { fallback(text, done); }
  }
  function fallback(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('복사에 실패했습니다'); }
    document.body.removeChild(ta);
  }

  async function sha256(s) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function unlock() {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('hub').classList.add('open');
    render();
  }
  function lockHub() {
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  }

  document.getElementById('lockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('pw');
    const err = document.getElementById('err');
    let ok = false;
    try { ok = (await sha256(input.value.trim())) === PW_HASH; } catch (x) { ok = false; }
    if (ok) {
      try { sessionStorage.setItem(KEY, '1'); } catch (x) {}
      unlock();
    } else {
      err.textContent = '비밀번호가 올바르지 않습니다.';
      const card = document.getElementById('lockForm');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      input.value = '';
      input.focus();
    }
  });

  try { if (sessionStorage.getItem(KEY) === '1') unlock(); } catch (e) {}
</script>
</body>
</html>
